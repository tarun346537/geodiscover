[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geodiscover"
version = "0.1.0"
description = "Search-guided geophysical acquisition planning"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
# MCTS is implemented locally in the planning modules.
learning = ["torch==2.9.1"]
service = ["fastapi==0.128.0", "pydantic==2.12.5", "uvicorn==0.40.0", "prometheus-client==0.23.1"]
benchmark = ["httpx==0.28.1"]
simulator = ["simpeg==0.25.0", "discretize==0.12.0", "pymatsolver==0.4.0", "scipy==1.16.3"]
distributed = ["ray==2.53.0", "redis==7.1.0"]
test = ["httpx==0.28.1", "pytest==9.0.2", "pytest-cov==7.0.0"]
profiling = ["nvidia-ml-py==13.590.44"]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "httpx==0.28.1", "ruff==0.14.10", "mypy==1.19.1"]

[tool.setuptools.packages.find]
include = ["geodiscover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
files = ["geodiscover"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["simpeg.*", "discretize.*", "pymatsolver.*", "ray.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["geodiscover"]

[tool.coverage.report]
show_missing = true
