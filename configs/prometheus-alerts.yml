groups:
  - name: geodiscover-planner
    rules:
      - alert: GeoDiscoverPlannerUnavailable
        expr: up{job="geodiscover"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: GeoDiscover metrics target is unavailable
      - alert: GeoDiscoverHighPlanLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(geodiscover_plan_seconds_bucket[5m]))) > 0.140
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Planning p99 exceeds the configured 140 ms target
      - alert: GeoDiscoverHighFallbackRate
        expr: sum(rate(geodiscover_fallbacks_total[5m])) / clamp_min(sum(rate(geodiscover_plans_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than five percent of decisions use the fallback
